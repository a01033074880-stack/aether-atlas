name: Windows release build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build pinned JUCE
        shell: pwsh
        run: ./scripts/build.ps1 -BuildDirectory build -Jobs 4
      - name: Upload VST3 and standalone
        uses: actions/upload-artifact@v4
        with:
          name: AetherMicro-1.0.0-Windows-x64
          path: |
            build/AetherMicro_artefacts/Release/VST3
            build/AetherMicro_artefacts/Release/Standalone
            build/AetherMicroSynth_artefacts/Release/VST3
            build/AetherMicroSynth_artefacts/Release/Standalone
